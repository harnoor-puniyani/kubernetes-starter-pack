kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: nginx
  namespace: nginx
spec:

  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx-dae-pod
      labels:
        app: nginx
    spec:
      containers:
        - name: nginxdae
          image: nginx:latest
          ports:
            - containerPort: 80

